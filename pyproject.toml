[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-marl"
version = "0.1.0"
description = "Intelligent Technical Project Management and Dynamic Scheduling using STGAT and MARL"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AI Multi-Agent Team"}
]
dependencies = [
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "gymnasium>=1.0.0",
    "pettingzoo>=1.24.0",
    "ortools>=9.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "websockets>=11.0",
    "python-multipart>=0.0.6",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "black",
    "ruff",
    "mypy",
    "flake8"
]
ml = [
    "torch>=2.0.0",
    "torchvision"
]
all = [
    "project-marl[api,dev,ml]"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning"
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
