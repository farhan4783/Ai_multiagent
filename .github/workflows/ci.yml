name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,ml,api]"

      - name: Build Web Dashboard SPA
        run: |
          cd web
          npm ci
          npm run build

      - name: Configure Git for Workspace Tests
        run: |
          git config --global user.name "CI Agent"
          git config --global user.email "ci-agent@github-actions.local"

      - name: Run Pytest Test Suite with Coverage
        run: |
          pytest -v --cov=project_marl --cov-report=xml --cov-report=term-missing

      - name: Run Zero-Config Quickstart Demo Validation
        run: |
          python scripts/demo_quickstart.py
